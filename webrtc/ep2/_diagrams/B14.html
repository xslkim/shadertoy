<!doctype html><html lang="zh"><head><meta charset="utf-8">
<link rel="stylesheet" href="theme.css"></head><body>
<div class="page tight">
  <div class="head-row"><span class="kicker">方案 ④ · 算力在云端</span></div>
  <div class="row mt8" style="align-items:baseline;gap:20px"><div class="h1">云游戏 / 云手机</div><span class="pill" style="font-size:24px;border-color:#8957e5;color:#d2a8ff">终端只负责显示</span></div>
  <div class="lead mt8">GeForce NOW、Xbox Cloud、各类云手机 —— 游戏/系统跑在云端 GPU，画面串到你的设备</div>

  <div class="row mt32 center" style="gap:0">
    <div class="card bg-purp center col" style="width:360px;height:200px"><div style="font-size:50px">☁️🎮</div><div class="card-title mt8" style="color:#d2a8ff">云端 GPU</div><div class="card-desc mt4" style="font-size:22px;text-align:center">运行游戏/应用<br>硬件编码画面</div></div>
    <div class="arrow" style="font-size:24px;flex-direction:column"><div>边缘机房就近</div><div style="font-size:32px">→</div><div>压低物理延迟</div></div>
    <div class="card bg-blue center col" style="width:360px;height:200px"><div style="font-size:50px">📱💻</div><div class="card-title accent mt8">你的终端</div><div class="card-desc mt4" style="font-size:22px;text-align:center">解码显示<br>回传操作指令</div></div>
  </div>

  <div class="grid g2 mt32" style="gap:28px">
    <div class="card bg-green" style="padding:24px"><div class="h2" style="font-size:27px;color:#3fb950">部分直接用 WebRTC</div><div class="card-desc mt8" style="font-size:24px">浏览器打开即玩，免安装</div></div>
    <div class="card bg-amber" style="padding:24px"><div class="h2" style="font-size:27px;color:#ffa657">部分用私有 UDP 协议</div><div class="card-desc mt8" style="font-size:24px">更可控、为高并发与超低延迟优化</div></div>
  </div>
  <div class="foot">本质还是那条管线，只是把算力整个搬到了云端</div>
</div>
</body></html>
