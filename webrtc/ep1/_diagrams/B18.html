<!doctype html><html lang="zh"><head><meta charset="utf-8">
<link rel="stylesheet" href="theme.css"></head><body>
<div class="page tight">
  <div class="head-row"><span class="kicker">AUDIO · OPUS</span></div>
  <div class="h1 mt8">音频之王：Opus</div>
  <div class="lead mt8">声音这边几乎没有悬念 —— 实时音频的事，Opus 基本包圆了</div>

  <div class="grid g2 mt32" style="gap:28px">
    <div class="card bg-blue" style="padding:28px;height:200px">
      <div class="row" style="gap:16px;align-items:center"><span style="font-size:46px">⚡</span><div class="card-title accent" style="font-size:32px">超低算法延迟</div></div>
      <div class="card-desc mt12" style="font-size:26px">帧长可低至 2.5ms，端到端延迟低到可以忽略，专为实时而生</div>
    </div>
    <div class="card bg-blue" style="padding:28px;height:200px">
      <div class="row" style="gap:16px;align-items:center"><span style="font-size:46px">🎚️</span><div class="card-title accent" style="font-size:32px">码率自由伸缩</div></div>
      <div class="card-desc mt12" style="font-size:26px">从 6 kbps 到 510 kbps，<b style="color:#e6edf3">语音、音乐通吃</b>，网差也能保通话</div>
    </div>
    <div class="card bg-green" style="padding:28px;height:200px">
      <div class="row" style="gap:16px;align-items:center"><span style="font-size:46px">🛡️</span><div class="card-title" style="font-size:32px;color:#3fb950">内置 FEC</div></div>
      <div class="card-desc mt12" style="font-size:26px">在码流里自带冗余，丢点包也能还原，自带抗丢包</div>
    </div>
    <div class="card bg-green" style="padding:28px;height:200px">
      <div class="row" style="gap:16px;align-items:center"><span style="font-size:46px">🤫</span><div class="card-title" style="font-size:32px;color:#3fb950">DTX 静音不发包</div></div>
      <div class="card-desc mt12" style="font-size:26px">你不说话时干脆不发包，省带宽、省电</div>
    </div>
  </div>

  <div class="card mt32 bg-soft row center" style="gap:18px;padding:22px">
    <span class="pill" style="font-size:24px">SILK · 语音内核</span><span style="color:#58a6ff;font-size:30px">+</span>
    <span class="pill" style="font-size:24px">CELT · 音乐内核</span>
    <span style="font-size:25px;color:#8b949e;margin-left:10px">→ 融合双内核，按内容自动切换</span>
  </div>
</div>
</body></html>
