<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../theme.css">
<div class="stage">
  <h1 class="title" style="font-size:52px;margin-bottom:48px">协程能做，也有它做不到的</h1>
  <div class="cards" style="width:86%">
    <div class="card">
      <h3 class="good">✓ 擅长</h3>
      <div class="item fg">按帧推进的时序逻辑</div>
      <div class="item fg">简单的等待与序列</div>
      <div class="item fg">和 Unity 生命周期天然贴合</div>
    </div>
    <div class="card">
      <h3 class="bad">✗ 短板</h3>
      <div class="item fg">不能 return 返回值</div>
      <div class="item fg">不能用 try-catch 包住 yield</div>
      <div class="item fg">嵌套组合、取消都很别扭</div>
    </div>
  </div>
</div>
