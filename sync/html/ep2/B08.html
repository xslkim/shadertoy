<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../theme.css">
<div class="stage">
  <h1 class="title bad" style="font-size:50px;margin-bottom:44px">坑：在后台线程碰 Unity API</h1>
  <div class="code" style="width:76%;font-size:27px"><span class="kw">await</span> <span class="type">Task</span>.<span class="type">Run</span>(() => {
    <span class="kw">var</span> result = <span class="type">HeavyCompute</span>();   <span class="good">// ✓ 后台算，没问题</span>
    transform.position = result;   <span class="bad">// ✗ 崩！这里是线程池线程</span>
});

<span class="cmt">// 正确：算在后台，改在 await 之后（已回主线程）</span>
<span class="kw">var</span> result = <span class="kw">await</span> <span class="type">Task</span>.<span class="type">Run</span>(() => <span class="type">HeavyCompute</span>());
transform.position = result;       <span class="good">// ✓ 安全</span></div>
</div>
