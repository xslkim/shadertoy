<!doctype html><html lang="zh"><head><meta charset="utf-8">
<link rel="stylesheet" href="theme.css"></head><body>
<div class="page">
  <div class="title">雾面玻璃：用 mip 做模糊</div>
  <div class="subtitle" style="margin-top:14px">显卡为背景图预生成一串缩小版，按需取用</div>

  <div class="row center" style="margin-top:46px;gap:64px">
    <!-- mip pyramid -->
    <svg width="640" height="420" viewBox="0 0 640 420" style="flex-shrink:0">
      <!-- levels -->
      <rect x="40"  y="40"  width="300" height="300" rx="8" fill="#1b2330" stroke="#30363d" stroke-width="2"/>
      <text x="190" y="365" fill="#8b949e" font-size="20" text-anchor="middle" class="mono">level 0 · 原图(清晰)</text>
      <rect x="380" y="40"  width="150" height="150" rx="6" fill="#222c3a" stroke="#30363d" stroke-width="2"/>
      <text x="455" y="210" fill="#8b949e" font-size="18" text-anchor="middle" class="mono">1 · 1/2</text>
      <rect x="380" y="240" width="80" height="80" rx="6" fill="#283342" stroke="#30363d" stroke-width="2"/>
      <text x="420" y="338" fill="#8b949e" font-size="18" text-anchor="middle" class="mono">2 · 1/4</text>
      <rect x="490" y="240" width="44" height="44" rx="5" fill="#2f3a4a" stroke="#30363d" stroke-width="2"/>
      <rect x="555" y="240" width="22" height="22" rx="4" fill="#39455a" stroke="#30363d" stroke-width="2"/>
      <text x="560" y="320" fill="#8b949e" font-size="18" text-anchor="middle" class="mono">… 越来越小</text>
      <!-- focus selector arrow -->
      <line x1="120" y1="395" x2="540" y2="395" stroke="#ffa657" stroke-width="3" marker-end="url(#m)"/>
      <defs><marker id="m" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="#ffa657"/></marker></defs>
      <text x="330" y="416" fill="#ffa657" font-size="20" text-anchor="middle" class="label">focus 越大 → 取越小的级 → 越模糊</text>
    </svg>

    <div class="col" style="width:740px;gap:20px">
      <div class="step"><div class="step-h">mipmap 金字塔</div><div class="step-d" style="font-size:26px">原图、1/2、1/4、1/8…… 层层缩小，硬件自动生成</div></div>
      <div class="step" style="border-left-color:#ffa657"><div class="step-h orange">textureLod 第三个参数</div><div class="step-d" style="font-size:26px"><span class="mono">focus</span> 指定取第几级，越高越模糊</div></div>
      <div class="step" style="border-left-color:#3fb950"><div class="step-h green">一个数 = 玻璃多雾</div><div class="step-d" style="font-size:26px">不用真的做高斯模糊，几乎零成本</div></div>
    </div>
  </div>

  <div class="code" style="margin-top:40px;align-self:center;width:1240px;font-size:27px"><span class="kw">vec3</span> col = <span class="fn">textureLod</span>(<span class="accent">iChannel0</span>, UV + n, <span class="orange">focus</span>).rgb;
                              <span class="com">//          ↑偏移=折射   ↑级别=模糊</span></div>
</div>
</body></html>
