<!doctype html><html lang="zh"><head><meta charset="utf-8">
<link rel="stylesheet" href="theme.css"></head><body>
<div class="page">
  <div class="title">唯一的原料：一张背景图与 UV</div>
  <div class="subtitle" style="margin-top:14px">屏幕坐标映射到照片上，正常取色就是原图</div>

  <div class="row center" style="margin-top:54px;gap:36px">
    <!-- 背景图 -->
    <div class="col center" style="width:480px">
      <img src="bg.png" style="width:460px;height:460px;object-fit:cover;border-radius:18px;border:1px solid #30363d">
      <div class="card-title accent" style="font-size:30px;margin-top:18px">背景图 iChannel0</div>
      <div class="card-desc" style="font-size:24px;text-align:center;margin-top:4px">夜晚城市灯光照片</div>
    </div>

    <div class="accent" style="font-size:60px">→</div>

    <!-- UV -->
    <div class="col center" style="width:480px">
      <svg width="460" height="460" viewBox="0 0 460 460">
        <rect x="40" y="20" width="400" height="400" rx="14" fill="#161b22" stroke="#30363d" stroke-width="2"/>
        <line x1="40" y1="420" x2="440" y2="420" stroke="#58a6ff" stroke-width="3"/>
        <line x1="40" y1="420" x2="40" y2="20" stroke="#58a6ff" stroke-width="3"/>
        <text x="40" y="455" fill="#8b949e" font-size="24" text-anchor="middle" class="mono">0</text>
        <text x="440" y="455" fill="#8b949e" font-size="24" text-anchor="middle" class="mono">1  →U</text>
        <text x="14" y="30" fill="#8b949e" font-size="24" text-anchor="middle" class="mono">1</text>
        <text x="14" y="200" fill="#8b949e" font-size="24" text-anchor="middle" class="mono">V</text>
        <circle cx="240" cy="220" r="12" fill="#3fb950"/>
        <text x="262" y="214" fill="#3fb950" font-size="24" class="mono">UV</text>
        <text x="262" y="246" fill="#8b949e" font-size="20" class="label">每个像素一对坐标</text>
      </svg>
      <div class="card-title accent" style="font-size:30px;margin-top:18px">UV 坐标 0~1</div>
      <div class="card-desc" style="font-size:24px;text-align:center;margin-top:4px">把屏幕映射到照片</div>
    </div>

    <div class="accent" style="font-size:60px">→</div>

    <!-- 采样 -->
    <div class="col center" style="width:430px">
      <div class="card col center" style="width:420px;height:460px;justify-content:center">
        <div style="font-size:60px">🎯</div>
        <div class="mono" style="font-size:24px;margin-top:24px;color:#e6edf3;text-align:center;line-height:1.7">
          <span class="fn">textureLod</span>(<br>
          &nbsp;&nbsp;<span class="accent">iChannel0</span>,<br>
          &nbsp;&nbsp;UV <span class="green">+ n</span>,<br>
          &nbsp;&nbsp;<span class="orange">focus</span> )
        </div>
        <div class="card-desc" style="font-size:23px;text-align:center;margin-top:22px">
          <span class="green">n</span> = 折射偏移　<span class="orange">focus</span> = 模糊级别
        </div>
      </div>
    </div>
  </div>

  <div class="muted" style="font-size:27px;text-align:center;margin-top:46px">整个特效，就是想办法算出 <span class="green">n</span> 和 <span class="orange">focus</span> 这两个数</div>
</div>
</body></html>
