<!doctype html><html lang="zh"><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css"></head>
<body>
<div class="stage">
  <div class="h-top">核心：<span class="accent">重投影误差</span> Reprojection Error</div>
  <div class="rule"></div>
  <div class="sub">标定要最小化的那个量 —— 预测像素与实测像素的差</div>

  <div class="row grow gap-m" style="margin-top:40px;align-items:stretch">
    <!-- LEFT: 3D world board -->
    <div class="card col" style="flex:0 0 470px">
      <div class="muted mono" style="font-size:24px">① 世界中的 3D 点</div>
      <div class="grow center col" style="position:relative">
        <svg width="380" height="300" viewBox="0 0 380 300">
          <!-- board as a parallelogram grid -->
          <polygon points="40,210 270,170 340,250 110,290" fill="#161b22" stroke="#30363d" stroke-width="2"/>
          <g stroke="#30363d" stroke-width="1.5">
            <line x1="117" y1="200" x2="187" y2="280"/><line x1="194" y1="190" x2="264" y2="270"/>
            <line x1="78" y1="218" x2="305" y2="178"/><line x1="93" y1="248" x2="320" y2="208"/>
          </g>
          <circle cx="200" cy="208" r="11" fill="#3fb950"/>
          <text x="218" y="200" fill="#e6edf3" font-size="26" font-family="JetBrains Mono">X</text>
          <text x="120" y="120" fill="#8b949e" font-size="22" font-family="JetBrains Mono">P = (X,Y,Z)</text>
          <text x="120" y="150" fill="#8b949e" font-size="20" font-family="JetBrains Mono">板上已知坐标</text>
        </svg>
      </div>
      <div class="tag" style="align-self:flex-start">AprilGrid 角点</div>
    </div>

    <!-- MIDDLE: projection pipeline -->
    <div class="card col gap-s grow" style="justify-content:center">
      <div class="muted mono" style="font-size:24px">② 投影模型 π(·) ：把 3D 点变成预测像素</div>
      <div class="col gap-s" style="margin-top:18px">
        <div class="row gap-s" style="align-items:center">
          <div class="badge-num" style="background:#bc8cff">R,t</div>
          <div style="font-size:30px"><b>外参 [R|t]</b> <span class="muted">→ 世界系转到相机系</span></div>
        </div>
        <div class="center" style="font-size:34px;color:var(--accent)">↓</div>
        <div class="row gap-s" style="align-items:center">
          <div class="badge-num">K</div>
          <div style="font-size:30px"><b>内参 K + 畸变</b> <span class="muted">→ 投到图像平面</span></div>
        </div>
        <div class="center" style="font-size:34px;color:var(--accent)">↓</div>
        <div class="code" style="font-size:28px;padding:24px 30px">
          <span class="fl">x̂</span> = π( <span class="kw">K</span>, <span class="purple">[R|t]</span>, <span class="cm">dist</span>, P )
          <div class="cm" style="font-size:22px;margin-top:8px"># 预测像素坐标</div>
        </div>
      </div>
    </div>

    <!-- RIGHT: image plane residual -->
    <div class="card col" style="flex:0 0 470px">
      <div class="muted mono" style="font-size:24px">③ 与实测像素比较</div>
      <div class="grow center">
        <svg width="380" height="300" viewBox="0 0 380 300">
          <rect x="30" y="30" width="320" height="240" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
          <text x="40" y="22" fill="#8b949e" font-size="18" font-family="JetBrains Mono">相机图像</text>
          <!-- zoom -->
          <circle cx="200" cy="150" r="78" fill="none" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 4"/>
          <!-- observed (green) -->
          <circle cx="172" cy="132" r="10" fill="#3fb950"/>
          <text x="60" y="120" fill="#3fb950" font-size="22" font-family="JetBrains Mono">x 实测</text>
          <!-- predicted (blue) -->
          <circle cx="232" cy="178" r="10" fill="#58a6ff"/>
          <text x="244" y="206" fill="#58a6ff" font-size="22" font-family="JetBrains Mono">x̂ 预测</text>
          <!-- residual -->
          <line x1="172" y1="132" x2="232" y2="178" stroke="#f85149" stroke-width="5"/>
          <text x="190" y="150" fill="#f85149" font-size="24" font-family="JetBrains Mono" font-weight="bold">e</text>
        </svg>
      </div>
      <div class="tag" style="align-self:flex-start;color:#f85149;background:rgba(248,81,73,.12);border-color:rgba(248,81,73,.4)">残差 e = x − x̂</div>
    </div>
  </div>

  <!-- bottom formula -->
  <div class="code center" style="margin-top:34px;font-size:36px;padding:28px">
    标定目标 ：&nbsp; <span class="kw">min</span> &nbsp;Σ<sub style="font-size:22px">i,j</sub>&nbsp; ‖ x<sub style="font-size:22px">ij</sub> − π( K, <span class="purple">T</span><sub style="font-size:22px">j</sub>, P<sub style="font-size:22px">i</sub> ) ‖²
    &nbsp;&nbsp;<span class="cm" style="font-size:26px"># 所有角点 i、所有视角 j 的重投影误差平方和</span>
  </div>
</div>
</body></html>
