<!doctype html><html lang="zh"><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css"></head>
<body>
<div class="stage">
  <div class="h-top">怎么判断<span class="accent">标定好不好</span></div>
  <div class="rule"></div>
  <div class="sub">看重投影误差散点：又小、又均匀、像随机噪声 = 好</div>

  <div class="row grow gap-l" style="margin-top:30px;align-items:stretch">
    <!-- good -->
    <div class="card col center" style="flex:1;border-top:5px solid var(--green)">
      <div class="green" style="font-size:32px;font-weight:800;align-self:flex-start">✓ 好的标定</div>
      <svg width="380" height="380" viewBox="0 0 380 380" id="good"></svg>
      <div style="font-size:28px">均值 ≈ <span class="green mono">0.18 px</span> · 各向同性、围绕原点</div>
    </div>
    <!-- bad -->
    <div class="card col center" style="flex:1;border-top:5px solid var(--red)">
      <div class="red" style="font-size:32px;font-weight:800;align-self:flex-start">✗ 有问题</div>
      <svg width="380" height="380" viewBox="0 0 380 380" id="bad"></svg>
      <div style="font-size:28px">均值 <span class="red mono">1.6 px</span> · 偏置 / 有结构 → 模型或数据错</div>
    </div>
    <!-- thresholds -->
    <div class="col gap-m" style="flex:0.85;justify-content:center">
      <div class="card col gap-s"><div class="green" style="font-size:30px;font-weight:700">&lt; 0.3 px</div>
        <div class="muted" style="font-size:25px">优秀，可直接上车</div></div>
      <div class="card col gap-s"><div class="amber" style="font-size:30px;font-weight:700">0.3 – 0.5 px</div>
        <div class="muted" style="font-size:25px">可接受，视精度需求</div></div>
      <div class="card col gap-s"><div class="red" style="font-size:30px;font-weight:700">&gt; 1 px / 有结构</div>
        <div class="muted" style="font-size:25px">重采或换模型，别凑合用</div></div>
    </div>
  </div>
</div>
<script>
const NS='http://www.w3.org/2000/svg';
function axes(s){const c=190;
  [['M20 190 H360'],['M190 20 V360']].forEach(d=>{const l=document.createElementNS(NS,'path');
    l.setAttribute('d',d[0]);l.setAttribute('stroke','#30363d');l.setAttribute('stroke-width','1.5');s.appendChild(l);});}
function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function plot(id,fn,color){const s=document.getElementById(id);axes(s);
  for(let i=0;i<260;i++){const[x,y]=fn();const cx=190+x,cy=190+y;
    const d=document.createElementNS(NS,'circle');d.setAttribute('cx',cx);d.setAttribute('cy',cy);
    d.setAttribute('r','3.2');d.setAttribute('fill',color);d.setAttribute('opacity','0.7');s.appendChild(d);}}
plot('good',()=>[gauss()*26,gauss()*26],'#3fb950');
plot('bad',()=>{const a=Math.random()*6.28,r=70+gauss()*22;return[Math.cos(a)*r+30,Math.sin(a)*r*0.6]},'#f85149');
</script>
</body></html>
