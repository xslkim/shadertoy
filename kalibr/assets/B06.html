<!doctype html><html lang="zh"><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css"></head>
<body>
<div class="stage">
  <div class="h-top">标定板：<span class="accent">AprilGrid</span></div>
  <div class="rule"></div>
  <div class="sub">Kalibr 推荐的靶标 —— 一格一格的 AprilTag，每个都有唯一 ID</div>

  <div class="row grow gap-l" style="margin-top:36px;align-items:center">
    <!-- white board with aprilgrid -->
    <div style="flex:0 0 760px;display:flex;justify-content:center">
      <div id="board" style="width:600px;background:#f5f5f0;border-radius:14px;padding:30px;
        display:grid;grid-template-columns:repeat(6,1fr);gap:22px;box-shadow:0 0 0 1px #30363d"></div>
    </div>
    <!-- why -->
    <div class="col gap-m grow">
      <div class="card row gap-m" style="align-items:flex-start;padding:28px 34px">
        <div style="font-size:36px">🆔</div>
        <div><div style="font-size:32px;font-weight:700">每个 tag 有唯一编码</div>
        <div class="muted" style="font-size:26px;margin-top:4px">检测到任意一个 tag，就知道它的 4 个角点在板上的精确 3D 坐标</div></div>
      </div>
      <div class="card row gap-m" style="align-items:flex-start;padding:28px 34px">
        <div style="font-size:36px">🧩</div>
        <div><div style="font-size:32px;font-weight:700">抗遮挡、抗出画</div>
        <div class="muted" style="font-size:26px;margin-top:4px">棋盘格必须整块可见；AprilGrid 只拍到一部分也能用</div></div>
      </div>
      <div class="card row gap-m" style="align-items:flex-start;padding:28px 34px">
        <div style="font-size:36px">🎯</div>
        <div><div style="font-size:32px;font-weight:700">自动亚像素角点</div>
        <div class="muted" style="font-size:26px;margin-top:4px">无需人工点击，检测器直接给出高精度角点</div></div>
      </div>
      <div class="tag" style="align-self:flex-start;font-size:24px">也支持 棋盘格 / 圆点格，但多相机首选 AprilGrid</div>
    </div>
  </div>
</div>
<script>
const board=document.getElementById('board');
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
for(let i=0;i<24;i++){
  const rnd=mulberry(i*97+13);
  const tag=document.createElement('div');
  tag.style.cssText='aspect-ratio:1;background:#111;padding:9%;display:grid;grid-template-columns:repeat(6,1fr);gap:0';
  for(let c=0;c<36;c++){
    const cell=document.createElement('div');
    const r=Math.floor(c/6),col=c%6;
    const border=(r===0||r===5||col===0||col===5);
    const on=border?false:rnd()>0.5;
    cell.style.background=on?'#f5f5f0':'#111';
    tag.appendChild(cell);
  }
  board.appendChild(tag);
}
</script>
</body></html>
