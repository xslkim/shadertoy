<!doctype html><html lang="zh"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"></head>
<body><div class="stage" style="justify-content:center;align-items:center;gap:8px">

  <div class="kicker" style="margin-bottom:10px">P A T H&nbsp;&nbsp;T R A C I N G</div>
  <div class="h-title" style="font-size:104px;text-align:center">路径追踪 <span style="color:var(--accent)">从原理到实现</span></div>
  <div class="rule" style="width:520px;margin:26px 0 22px"></div>
  <div class="h-sub" style="font-size:38px">模拟光线传播 · 数值求解渲染方程</div>

  <!-- 中部：相机 → Cornell Box 内弹射光路 -->
  <svg width="1180" height="360" viewBox="0 0 1180 360" style="margin-top:30px">
    <defs>
      <linearGradient id="ray" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#1f6feb"/><stop offset="1" stop-color="#cfe8ff"/>
      </linearGradient>
      <radialGradient id="lamp" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#fff7d6"/><stop offset="1" stop-color="#e3b341" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <!-- box -->
    <rect x="360" y="40" width="500" height="300" rx="10" fill="#11161f" stroke="#30363d" stroke-width="2"/>
    <rect x="360" y="40" width="14" height="300" fill="#ff7b72" opacity=".85"/>
    <rect x="846" y="40" width="14" height="300" fill="#58a6ff" opacity=".85"/>
    <ellipse cx="610" cy="56" rx="120" ry="44" fill="url(#lamp)"/>
    <rect x="540" y="46" width="140" height="12" rx="6" fill="#ffe9a8"/>
    <circle cx="500" cy="276" r="40" fill="#0d1117" stroke="#9fb4cc" stroke-width="3"/>
    <circle cx="488" cy="262" r="11" fill="#dfe9f5" opacity=".8"/>
    <circle cx="715" cy="282" r="36" fill="#11202b" stroke="#8fd3ff" stroke-width="3" opacity=".9"/>
    <!-- camera -->
    <g transform="translate(150,180)">
      <rect x="-70" y="-34" width="96" height="68" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="3"/>
      <polygon points="26,-20 60,-36 60,36 26,20" fill="#161b22" stroke="#58a6ff" stroke-width="3"/>
    </g>
    <!-- bounce path -->
    <polyline points="232,170 500,236 730,250 610,70" fill="none" stroke="url(#ray)" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
    <g fill="#cfe8ff"><circle cx="500" cy="236" r="9"/><circle cx="730" cy="250" r="9"/><circle cx="610" cy="70" r="10" fill="#fff7d6"/></g>
  </svg>

  <!-- 四个图标 -->
  <div class="row gap48" style="margin-top:34px">
    <!-- 追踪光线 -->
    <div class="col center gap16" style="width:200px">
      <div class="row center" style="width:120px;height:120px;border-radius:50%;background:rgba(88,166,255,.14);border:1px solid rgba(88,166,255,.4)">
        <svg width="62" height="62" viewBox="0 0 62 62"><circle cx="12" cy="31" r="6" fill="#58a6ff"/><line x1="16" y1="31" x2="50" y2="31" stroke="#58a6ff" stroke-width="3"/><polyline points="40,21 52,31 40,41" fill="none" stroke="#58a6ff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></svg>
      </div><div class="pt">追踪光线</div></div>
    <!-- 随机采样 -->
    <div class="col center gap16" style="width:200px">
      <div class="row center" style="width:120px;height:120px;border-radius:50%;background:rgba(88,166,255,.14);border:1px solid rgba(88,166,255,.4)">
        <svg width="58" height="58" viewBox="0 0 58 58"><rect x="6" y="6" width="46" height="46" rx="10" fill="none" stroke="#58a6ff" stroke-width="3"/><circle cx="18" cy="18" r="4.5" fill="#58a6ff"/><circle cx="40" cy="18" r="4.5" fill="#58a6ff"/><circle cx="29" cy="29" r="4.5" fill="#58a6ff"/><circle cx="18" cy="40" r="4.5" fill="#58a6ff"/><circle cx="40" cy="40" r="4.5" fill="#58a6ff"/></svg>
      </div><div class="pt">随机采样</div></div>
    <!-- 反复弹射 -->
    <div class="col center gap16" style="width:200px">
      <div class="row center" style="width:120px;height:120px;border-radius:50%;background:rgba(88,166,255,.14);border:1px solid rgba(88,166,255,.4)">
        <svg width="60" height="60" viewBox="0 0 60 60"><polyline points="6,46 22,16 36,40 54,12" fill="none" stroke="#58a6ff" stroke-width="3" stroke-linejoin="round"/><circle cx="22" cy="16" r="4" fill="#58a6ff"/><circle cx="36" cy="40" r="4" fill="#58a6ff"/></svg>
      </div><div class="pt">反复弹射</div></div>
    <!-- 全局光照 -->
    <div class="col center gap16" style="width:200px">
      <div class="row center" style="width:120px;height:120px;border-radius:50%;background:rgba(88,166,255,.14);border:1px solid rgba(88,166,255,.4)">
        <svg width="56" height="56" viewBox="0 0 56 56"><circle cx="28" cy="24" r="15" fill="none" stroke="#58a6ff" stroke-width="3"/><line x1="22" y1="44" x2="34" y2="44" stroke="#58a6ff" stroke-width="3"/><g stroke="#58a6ff" stroke-width="3" stroke-linecap="round"><line x1="28" y1="2" x2="28" y2="8"/><line x1="6" y1="24" x2="12" y2="24"/><line x1="44" y1="24" x2="50" y2="24"/><line x1="12" y1="8" x2="16" y2="12"/><line x1="44" y1="8" x2="40" y2="12"/></g></svg>
      </div><div class="pt">全局光照</div></div>
  </div>

</div></body></html>
