<!doctype html><html lang="zh"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"></head>
<body><div class="stage">
  <div class="title-row" style="margin-bottom:6px">
    <div class="h-title">漫反射 <span class="dim" style="font-weight:600">随机</span> &nbsp;vs&nbsp; 镜面 <span class="dim" style="font-weight:600">确定</span></div>
    <div class="rule" style="width:440px"></div>
  </div>

  <div class="row grow gap48" style="margin-top:30px">
    <!-- 漫反射 -->
    <div class="col grow card" style="padding:0;overflow:hidden">
      <div class="card-top" style="background:var(--orange)"></div>
      <div class="col" style="padding:34px 44px;height:100%">
        <div class="row between center"><div style="font-size:46px;font-weight:800">漫反射 · 随机</div>
          <div class="tag" style="background:rgba(255,166,87,.18);color:var(--orange)">DIFFUSE</div></div>
        <svg width="100%" height="420" viewBox="0 0 740 420" preserveAspectRatio="xMidYMid meet" style="margin-top:8px">
          <line x1="60" y1="330" x2="680" y2="330" stroke="#30363d" stroke-width="3"/>
          <!-- 法线 -->
          <line x1="370" y1="330" x2="370" y2="120" stroke="#8b949e" stroke-width="2" stroke-dasharray="6 7"/>
          <text x="384" y="138" fill="#8b949e" font-size="24">法线 N</text>
          <!-- 余弦加权：靠法线粗密，靠水平稀细 -->
          <g stroke="#58a6ff" stroke-linecap="round" fill="none">
            <line x1="370" y1="330" x2="370" y2="150" stroke-width="7"/>
            <line x1="370" y1="330" x2="320" y2="158" stroke-width="6"/>
            <line x1="370" y1="330" x2="424" y2="160" stroke-width="6"/>
            <line x1="370" y1="330" x2="276" y2="186" stroke-width="4.5"/>
            <line x1="370" y1="330" x2="470" y2="190" stroke-width="4.5"/>
            <line x1="370" y1="330" x2="226" y2="246" stroke-width="3"/>
            <line x1="370" y1="330" x2="516" y2="250" stroke-width="3"/>
            <line x1="370" y1="330" x2="180" y2="300" stroke-width="2" opacity=".7"/>
            <line x1="370" y1="330" x2="560" y2="302" stroke-width="2" opacity=".7"/>
          </g>
          <circle cx="370" cy="330" r="8" fill="#e6edf3"/>
        </svg>
        <div class="pt" style="margin-top:auto">靠近法线概率更高 · <span style="color:var(--orange)">余弦加权</span><br><span class="dim">采样概率约掉复杂项，结果极简洁</span></div>
      </div>
    </div>

    <!-- 镜面 -->
    <div class="col grow card" style="padding:0;overflow:hidden;border-color:rgba(88,166,255,.5)">
      <div class="card-top" style="background:var(--accent)"></div>
      <div class="col" style="padding:34px 44px;height:100%">
        <div class="row between center"><div style="font-size:46px;font-weight:800">镜面 · 确定</div>
          <div class="tag" style="background:rgba(88,166,255,.18);color:var(--accent)">SPECULAR</div></div>
        <svg width="100%" height="420" viewBox="0 0 740 420" preserveAspectRatio="xMidYMid meet" style="margin-top:8px">
          <line x1="60" y1="330" x2="680" y2="330" stroke="#30363d" stroke-width="3"/>
          <line x1="370" y1="330" x2="370" y2="120" stroke="#8b949e" stroke-width="2" stroke-dasharray="6 7"/>
          <text x="384" y="138" fill="#8b949e" font-size="24">法线 N</text>
          <!-- 入射 -->
          <line x1="200" y1="170" x2="370" y2="330" stroke="#fff3c4" stroke-width="6"/>
          <polygon points="370,330 352,322 358,308" fill="#fff3c4"/>
          <!-- 反射 -->
          <line x1="370" y1="330" x2="540" y2="170" stroke="#58a6ff" stroke-width="6"/>
          <polygon points="540,170 528,184 518,176" fill="#58a6ff"/>
          <!-- 等角弧 -->
          <path d="M300 250 A100 100 0 0 1 326 222" fill="none" stroke="#8b949e" stroke-width="2"/>
          <path d="M414 222 A100 100 0 0 1 440 250" fill="none" stroke="#8b949e" stroke-width="2"/>
          <text x="262" y="240" fill="#8b949e" font-size="24">θ</text><text x="452" y="240" fill="#8b949e" font-size="24">θ</text>
          <circle cx="370" cy="330" r="8" fill="#e6edf3"/>
        </svg>
        <div class="pt" style="margin-top:auto">入射角 = 反射角 · 唯一确定<br><span class="dim">无需随机，产生无噪点的完美镜像</span></div>
      </div>
    </div>
  </div>
</div></body></html>
