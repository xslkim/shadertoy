<!doctype html><html lang="zh"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"></head>
<body><div class="stage">
  <div class="title-row" style="margin-bottom:6px">
    <div class="h-title">三种材质，<span style="color:var(--accent)">三种弹射</span></div>
    <div class="rule" style="width:360px"></div>
  </div>

  <div class="row grow gap48" style="margin-top:30px">
    <!-- 漫反射 -->
    <div class="col grow card" style="padding:0;overflow:hidden">
      <div class="card-top" style="background:var(--orange)"></div>
      <div class="col center" style="padding:34px 32px;height:100%">
        <div style="font-size:48px;font-weight:800;color:var(--orange)">漫反射</div>
        <div class="label" style="margin-top:4px">墙壁 · 木头 · 布料</div>
        <svg width="320" height="300" viewBox="0 0 320 300" style="margin:14px 0">
          <line x1="20" y1="240" x2="300" y2="240" stroke="#30363d" stroke-width="3"/>
          <circle cx="160" cy="240" r="58" fill="#2a2018" stroke="#caa472" stroke-width="3"/>
          <line x1="60" y1="150" x2="160" y2="240" stroke="#fff3c4" stroke-width="5"/>
          <g stroke="#ffd9a0" stroke-width="3" fill="none" stroke-linecap="round" opacity=".9">
            <line x1="160" y1="240" x2="160" y2="110"/><line x1="160" y1="240" x2="90" y2="140"/>
            <line x1="160" y1="240" x2="230" y2="140"/><line x1="160" y1="240" x2="250" y2="190"/>
            <line x1="160" y1="240" x2="70" y2="190"/><line x1="160" y1="240" x2="200" y2="118"/></g>
        </svg>
        <div class="pt" style="text-align:center">随机弹向任意方向<br><span class="dim">产生柔和的颜色溢出</span></div>
      </div>
    </div>
    <!-- 镜面反射 -->
    <div class="col grow card" style="padding:0;overflow:hidden">
      <div class="card-top" style="background:var(--accent)"></div>
      <div class="col center" style="padding:34px 32px;height:100%">
        <div style="font-size:48px;font-weight:800;color:var(--accent)">镜面反射</div>
        <div class="label" style="margin-top:4px">镜子 · 抛光金属</div>
        <svg width="320" height="300" viewBox="0 0 320 300" style="margin:14px 0">
          <line x1="20" y1="240" x2="300" y2="240" stroke="#30363d" stroke-width="3"/>
          <defs><radialGradient id="mir" cx="40%" cy="30%" r="75%"><stop offset="0" stop-color="#cfe6fb"/><stop offset="1" stop-color="#26303d"/></radialGradient></defs>
          <circle cx="160" cy="240" r="58" fill="url(#mir)" stroke="#8fd3ff" stroke-width="3"/>
          <line x1="160" y1="240" x2="160" y2="120" stroke="#3b4a5e" stroke-width="2" stroke-dasharray="5 6"/>
          <line x1="70" y1="150" x2="160" y2="240" stroke="#fff3c4" stroke-width="5"/>
          <line x1="160" y1="240" x2="250" y2="150" stroke="#58a6ff" stroke-width="5"/>
          <polygon points="250,150 236,156 244,166" fill="#58a6ff"/>
          <path d="M132 168 A40 40 0 0 1 188 168" fill="none" stroke="#8b949e" stroke-width="2"/>
        </svg>
        <div class="pt" style="text-align:center">入射角 = 反射角<br><span class="dim">方向确定，没有噪点</span></div>
      </div>
    </div>
    <!-- 折射 -->
    <div class="col grow card" style="padding:0;overflow:hidden">
      <div class="card-top" style="background:var(--green)"></div>
      <div class="col center" style="padding:34px 32px;height:100%">
        <div style="font-size:48px;font-weight:800;color:var(--green)">折射</div>
        <div class="label" style="margin-top:4px">玻璃 · 水 · 钻石</div>
        <svg width="320" height="300" viewBox="0 0 320 300" style="margin:14px 0">
          <line x1="20" y1="240" x2="300" y2="240" stroke="#30363d" stroke-width="3"/>
          <circle cx="160" cy="200" r="62" fill="#10242a" stroke="#7fe0c8" stroke-width="3" opacity=".92"/>
          <circle cx="142" cy="180" r="14" fill="#cfeee6" opacity=".5"/>
          <!-- 入射 -->
          <line x1="60" y1="150" x2="128" y2="184" stroke="#fff3c4" stroke-width="5"/>
          <!-- 折射穿透（偏折） -->
          <line x1="128" y1="184" x2="190" y2="234" stroke="#3fb950" stroke-width="5"/>
          <line x1="190" y1="234" x2="266" y2="250" stroke="#3fb950" stroke-width="5"/>
          <polygon points="266,250 252,248 256,260" fill="#3fb950"/>
          <!-- 部分反射 -->
          <line x1="128" y1="184" x2="150" y2="110" stroke="#8fd3ff" stroke-width="4" stroke-dasharray="6 6"/>
        </svg>
        <div class="pt" style="text-align:center">穿透 + 反射同时发生<br><span class="dim">Snell 定律改变方向</span></div>
      </div>
    </div>
  </div>
</div></body></html>
