<!doctype html><html lang="zh"><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css"></head>
<body>
<div class="stage">
  <div class="h-top">信息安全：<span class="accent">ISO 21434</span> 车辆网络安全</div>
  <div class="rule"></div>
  <div class="sub">功能安全管「自己别出错」· 信息安全管「别人别搞破坏」</div>

  <div class="row grow gap-m" style="margin-top:54px;align-items:stretch">
    <div class="card col gap-s grow" style="padding:36px;align-items:center;justify-content:center">
      <div class="badge-num">1</div>
      <div style="font-size:36px;font-weight:700;margin-top:18px">加密传输</div>
      <div class="muted mono" style="font-size:24px;margin-top:10px">DTLS / TLS</div>
      <div class="muted" style="font-size:24px;text-align:center;margin-top:14px;line-height:1.5">数据在网络中全程加密<br>窃听也看不到明文</div>
    </div>
    <div class="card col gap-s grow" style="padding:36px;align-items:center;justify-content:center">
      <div class="badge-num">2</div>
      <div style="font-size:36px;font-weight:700;margin-top:18px">身份鉴权</div>
      <div class="muted mono" style="font-size:24px;margin-top:10px">AuthN / AuthZ</div>
      <div class="muted" style="font-size:24px;text-align:center;margin-top:14px;line-height:1.5">谁能发哪个话题<br>谁能订阅哪路数据</div>
    </div>
    <div class="card col gap-s grow" style="padding:36px;align-items:center;justify-content:center">
      <div class="badge-num">3</div>
      <div style="font-size:36px;font-weight:700;margin-top:18px">日志可审计</div>
      <div class="muted mono" style="font-size:24px;margin-top:10px">Audit Log</div>
      <div class="muted" style="font-size:24px;text-align:center;margin-top:14px;line-height:1.5">所有操作留痕<br>事后可追溯、可追责</div>
    </div>
    <div class="card col gap-s grow" style="padding:36px;align-items:center;justify-content:center">
      <div class="badge-num">4</div>
      <div style="font-size:36px;font-weight:700;margin-top:18px">漏洞响应</div>
      <div class="muted mono" style="font-size:24px;margin-top:10px">CSMS / SBOM</div>
      <div class="muted" style="font-size:24px;text-align:center;margin-top:14px;line-height:1.5">发现漏洞要有流程<br>定期补丁、可追溯</div>
    </div>
  </div>

  <div class="row between" style="margin-top:36px;align-items:center">
    <div class="tag" style="color:var(--red);background:rgba(248,81,73,.12);border-color:rgba(248,81,73,.4)">联网的车 = 攻击面</div>
    <div class="muted mono" style="font-size:24px">黑客不能远程给刹车下指令</div>
  </div>
</div>
</body></html>
