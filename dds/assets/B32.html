<!doctype html><html lang="zh"><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css"></head>
<body>
<div class="stage">
  <div class="h-top">量产 <span class="accent">≠</span> Demo</div>
  <div class="rule"></div>
  <div class="sub">从「能跑」到「能上车」，中间要补的课</div>

  <div class="row grow gap-m" style="margin-top:54px;align-items:stretch">
    <!-- 左：Demo -->
    <div class="card col gap-s grow" style="padding:42px;background:#0d1117;border-color:var(--border)">
      <div class="mono muted" style="font-size:26px">Demo 能跑就行</div>
      <div class="tbl" style="margin-top:20px">
        <div class="tr"><span class="muted" style="font-size:28px">偶尔卡顿没事</span></div>
        <div class="tr"><span class="muted" style="font-size:28px">数据丢几帧无所谓</span></div>
        <div class="tr"><span class="muted" style="font-size:28px">重启就能恢复</span></div>
        <div class="tr"><span class="muted" style="font-size:28px">一台机器一个进程</span></div>
      </div>
    </div>
    <!-- 箭头 -->
    <div class="col center" style="flex:0 0 120px">
      <div class="accent" style="font-size:60px;font-weight:800">→</div>
      <div class="muted mono" style="font-size:20px;margin-top:8px">要补的课</div>
    </div>
    <!-- 右：量产 -->
    <div class="card col gap-s grow" style="padding:42px;border-color:var(--accent);border-width:2px">
      <div class="mono accent" style="font-size:26px">量产必须做到</div>
      <div class="tbl" style="margin-top:20px">
        <div class="tr"><span class="accent" style="font-size:28px">抖动可控，deadline 必达</span></div>
        <div class="tr"><span class="accent" style="font-size:28px">关键数据零丢失</span></div>
        <div class="tr"><span class="accent" style="font-size:28px">故障自动降级不瘫痪</span></div>
        <div class="tr"><span class="accent" style="font-size:28px">多控制器协同、长期运行</span></div>
      </div>
    </div>
  </div>
</div>
</body></html>
