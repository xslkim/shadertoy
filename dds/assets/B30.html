<!doctype html><html lang="zh"><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css"></head>
<body>
<div class="stage">
  <div class="h-top">三大商业产品 <span class="accent">巡礼</span></div>
  <div class="rule"></div>
  <div class="sub">同一个底层（DDS），不同的商业外壳</div>

  <div class="row grow gap-m" style="margin-top:54px;align-items:stretch">
    <div class="card col gap-s grow" style="padding:42px;border-color:var(--accent);border-width:2px">
      <div class="mono accent" style="font-size:24px">① RTI</div>
      <div style="font-size:44px;font-weight:800;margin-top:8px">Connext Drive</div>
      <div class="tag" style="align-self:flex-start;margin-top:18px;color:var(--green);background:rgba(63,185,80,.12);border-color:rgba(63,185,80,.4)">首个 ASIL-D DDS</div>
      <div class="muted" style="font-size:26px;line-height:1.6;margin-top:18px">业界第一份通过<br>ASIL-D 认证的 DDS 实现</div>
      <div style="height:2px;background:var(--border);margin:24px 0"></div>
      <div class="muted mono" style="font-size:22px">主要客户：美系 / 通用系</div>
    </div>
    <div class="card col gap-s grow" style="padding:42px;border-color:var(--accent);border-width:2px">
      <div class="mono accent" style="font-size:24px">② Apex.AI</div>
      <div style="font-size:44px;font-weight:800;margin-top:8px">Apex.OS</div>
      <div class="tag" style="align-self:flex-start;margin-top:18px;color:var(--green);background:rgba(63,185,80,.12);border-color:rgba(63,185,80,.4)">认证版 ROS2</div>
      <div class="muted" style="font-size:26px;line-height:1.6;margin-top:18px">把开源 ROS2 做了<br>功能安全认证的商用分支</div>
      <div style="height:2px;background:var(--border);margin:24px 0"></div>
      <div class="muted mono" style="font-size:22px">主要客户：德系 / 丰田系</div>
    </div>
    <div class="card col gap-s grow" style="padding:42px;border-color:var(--accent);border-width:2px">
      <div class="mono accent" style="font-size:24px">③ TTTech Auto</div>
      <div style="font-size:44px;font-weight:800;margin-top:8px">MotionWise</div>
      <div class="tag" style="align-self:flex-start;margin-top:18px;color:var(--green);background:rgba(63,185,80,.12);border-color:rgba(63,185,80,.4)">整车中间件平台</div>
      <div class="muted" style="font-size:26px;line-height:1.6;margin-top:18px">奥地利厂商的<br>完整整车中间件方案</div>
      <div style="height:2px;background:var(--border);margin:24px 0"></div>
      <div class="muted mono" style="font-size:22px">主要客户：奥迪 / 欧洲 OEM</div>
    </div>
  </div>
</div>
</body></html>
