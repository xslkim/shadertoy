<!doctype html><html lang="zh"><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css"></head>
<body>
<div class="stage">
  <div class="h-top">给 C++ 程序员的 <span class="accent">三条建议</span></div>
  <div class="rule"></div>
  <div class="sub">从「能跑」到「懂为什么这么跑」</div>

  <div class="row grow gap-m" style="margin-top:54px;align-items:stretch">
    <div class="card col gap-s grow" style="padding:42px">
      <div class="badge-num">1</div>
      <div style="font-size:38px;font-weight:700;margin-top:18px">读源码</div>
      <div class="muted" style="font-size:26px;line-height:1.6;margin-top:14px">从 <span class="mono accent">Cyclone DDS</span> 入手<br>体量适中，结构清晰<br>最适合入门的 DDS 实现</div>
    </div>
    <div class="card col gap-s grow" style="padding:42px">
      <div class="badge-num">2</div>
      <div style="font-size:38px;font-weight:700;margin-top:18px">动手做</div>
      <div class="muted" style="font-size:26px;line-height:1.6;margin-top:14px">自己写一个 pub/sub<br>对比 <span class="mono accent">RELIABLE</span> 和<br><span class="mono accent">BEST_EFFORT</span> 的延迟差异</div>
    </div>
    <div class="card col gap-s grow" style="padding:42px">
      <div class="badge-num">3</div>
      <div style="font-size:38px;font-weight:700;margin-top:18px">玩工具</div>
      <div class="muted" style="font-size:26px;line-height:1.6;margin-top:14px">用 <span class="mono accent">ros2 bag</span><br>录一段数据再回放<br>真正走一遍完整数据流</div>
    </div>
  </div>
</div>
</body></html>
