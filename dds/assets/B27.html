<!doctype html><html lang="zh"><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css"></head>
<body>
<div class="stage">
  <div class="h-top">商业版卖的，是 <span class="accent">这三样</span></div>
  <div class="rule"></div>
  <div class="sub">买的不是软件，是「可量产的确定性」</div>

  <div class="row grow gap-m" style="margin-top:54px;align-items:stretch">
    <div class="card col gap-s grow" style="padding:42px">
      <div class="badge-num" style="background:var(--accent)">1</div>
      <div style="font-size:40px;font-weight:700;margin-top:18px">认证证据</div>
      <div class="muted" style="font-size:26px;line-height:1.6;margin-top:14px">功能安全认证要上百份文档<br>它都替你备好了，现成可复用</div>
    </div>
    <div class="card col gap-s grow" style="padding:42px">
      <div class="badge-num" style="background:var(--accent)">2</div>
      <div style="font-size:40px;font-weight:700;margin-top:18px">赔偿责任</div>
      <div class="muted" style="font-size:26px;line-height:1.6;margin-top:14px">出了事故，厂商一起担责<br>白纸黑字写进合同</div>
    </div>
    <div class="card col gap-s grow" style="padding:42px">
      <div class="badge-num" style="background:var(--accent)">3</div>
      <div style="font-size:40px;font-weight:700;margin-top:18px">长期支持</div>
      <div class="muted" style="font-size:26px;line-height:1.6;margin-top:14px">十年起步的维护和补丁<br>保证车子能卖、能修</div>
    </div>
  </div>

  <div class="row between" style="margin-top:54px;align-items:center">
    <div class="tag" style="font-size:26px">可量产的确定性</div>
    <div class="muted mono" style="font-size:24px">≠ 代码本身</div>
  </div>
</div>
</body></html>
