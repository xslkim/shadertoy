<!doctype html><html lang="zh"><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css"></head>
<body>
<div class="stage">
  <div class="h-top">ROS2 直接量产的 <span class="accent">四个坑</span></div>
  <div class="rule"></div>
  <div class="sub">能跑 ≠ 能上车 —— 这些坑正是其他方案要解决的</div>

  <div class="row grow gap-m" style="margin-top:54px;align-items:stretch">
    <div class="card col gap-s grow" style="padding:42px">
      <div class="badge-num" style="background:var(--red)">1</div>
      <div style="font-size:42px;font-weight:700;margin-top:18px">实时性不足</div>
      <div class="muted" style="font-size:28px;line-height:1.6;margin-top:14px">默认非抢占调度<br>延迟抖动大，deadline 无保证</div>
    </div>
    <div class="card col gap-s grow" style="padding:42px">
      <div class="badge-num" style="background:var(--red)">2</div>
      <div style="font-size:42px;font-weight:700;margin-top:18px">无启动顺序</div>
      <div class="muted" style="font-size:28px;line-height:1.6;margin-top:14px">节点谁先起、依赖谁<br>全靠运气，没有依赖管理</div>
    </div>
    <div class="card col gap-s grow" style="padding:42px">
      <div class="badge-num" style="background:var(--red)">3</div>
      <div style="font-size:42px;font-weight:700;margin-top:18px">资源偏重</div>
      <div class="muted" style="font-size:28px;line-height:1.6;margin-top:14px">对嵌入式、MCU 场景<br>占用偏大，不易裁剪</div>
    </div>
    <div class="card col gap-s grow" style="padding:42px">
      <div class="badge-num" style="background:var(--red)">4</div>
      <div style="font-size:42px;font-weight:700;margin-top:18px">发现开销爆炸</div>
      <div class="muted" style="font-size:28px;line-height:1.6;margin-top:14px">节点一多，初始发现的<br>元数据交换量 O(n²) 膨胀</div>
    </div>
  </div>

  <div class="row between" style="margin-top:48px;align-items:center">
    <div class="tag" style="color:var(--accent)">→ 需要 CyberRT / 商业版来补</div>
    <div class="muted mono" style="font-size:24px">每块短板，都对应一个方案的诞生理由</div>
  </div>
</div>
</body></html>
