<!doctype html><html lang="zh"><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css"></head>
<body>
<div class="stage">
  <div class="h-top">选型 <span class="accent">决策树</span></div>
  <div class="rule"></div>
  <div class="sub">没有最好的中间件，只有最合适的场景</div>

  <div class="row grow gap-m" style="margin-top:44px;align-items:stretch">
    <!-- 场景→推荐 -->
    <div class="card col gap-s grow" style="padding:36px">
      <div class="muted mono" style="font-size:22px">场景①</div>
      <div style="font-size:36px;font-weight:700;margin-top:6px">研究 / Demo</div>
      <div style="height:2px;background:var(--border);margin:18px 0"></div>
      <div class="muted mono" style="font-size:20px">推荐</div>
      <div class="tag" style="font-size:26px;margin-top:6px;align-self:flex-start">ROS2 + Cyclone</div>
    </div>
    <div class="card col gap-s grow" style="padding:36px">
      <div class="muted mono" style="font-size:22px">场景②</div>
      <div style="font-size:36px;font-weight:700;margin-top:6px">自动驾驶研发</div>
      <div style="height:2px;background:var(--border);margin:18px 0"></div>
      <div class="muted mono" style="font-size:20px">推荐</div>
      <div class="tag" style="font-size:26px;margin-top:6px;align-self:flex-start">ROS2 + FastDDS / CyberRT</div>
    </div>
    <div class="card col gap-s grow" style="padding:36px;border-color:var(--accent);border-width:2px">
      <div class="muted mono" style="font-size:22px">场景③</div>
      <div style="font-size:36px;font-weight:700;margin-top:6px">量产车规</div>
      <div style="height:2px;background:var(--border);margin:18px 0"></div>
      <div class="muted mono" style="font-size:20px">推荐</div>
      <div class="tag" style="font-size:26px;margin-top:6px;align-self:flex-start">AUTOSAR AP + 商业 DDS</div>
    </div>
    <div class="card col gap-s grow" style="padding:36px">
      <div class="muted mono" style="font-size:22px">场景④</div>
      <div style="font-size:36px;font-weight:700;margin-top:6px">车云 / V2X</div>
      <div style="height:2px;background:var(--border);margin:18px 0"></div>
      <div class="muted mono" style="font-size:20px">推荐</div>
      <div class="tag" style="font-size:26px;margin-top:6px;align-self:flex-start">Zenoh</div>
    </div>
  </div>

  <div class="row between" style="margin-top:48px;align-items:center">
    <div class="muted" style="font-size:28px">→ 下集：商业 DDS 凭什么卖钱？量产还要做什么？</div>
    <div class="tag" style="font-size:24px">ep.2 商业化 + 量产</div>
  </div>
</div>
</body></html>
