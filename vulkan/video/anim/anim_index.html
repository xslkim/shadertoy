<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../frames/frame.css">
<style>
  .flow{flex:1;display:flex;align-items:center;justify-content:center;gap:40px;margin-top:20px}
  .box{background:linear-gradient(180deg,#16162a,#101020);border:1px solid var(--line);
    border-radius:20px;padding:34px 38px;text-align:center}
  .box .lbl{font-size:24px;color:var(--muted);margin-bottom:16px;letter-spacing:1px}
  .box .big{font-size:34px}.box code{font-size:30px}
  .idxnum{font-size:96px;font-weight:800;color:var(--accent);line-height:1}
  .heapmini{display:grid;grid-template-columns:repeat(3,72px);gap:8px}
  .cell{height:60px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;
    font-size:20px;color:var(--muted)}
  .cell.on{border-color:var(--accent);box-shadow:0 0 26px rgba(255,90,138,.6);color:#fff}
  .arrow{font-size:64px;color:var(--accent2)}
  .shot{width:330px;border-radius:16px;border:1px solid var(--line);display:block}
  .cap{font-size:24px;color:var(--muted);margin-top:14px;text-align:center}
  .rv{transition:opacity .25s}
</style></head><body>
<div class="frame">
  <div class="kicker">04 · 核心 B</div>
  <div class="title">CPU 推一个<span class="ext">索引</span>,GPU 自己去堆里取</div>
  <div class="flow">
    <div class="box rv" data-at="1">
      <div class="lbl">① CPU 每帧</div>
      <div class="idxnum">2</div>
      <div class="big" style="margin-top:14px"><code>vkCmdPushDataEXT</code></div>
      <div class="cap">push 一个整数索引</div>
    </div>
    <div class="arrow rv" data-at="2">→</div>
    <div class="box rv" data-at="2">
      <div class="lbl">② GPU shader</div>
      <div class="heapmini">
        <div class="cell">0</div><div class="cell">1</div><div class="cell on">2</div>
        <div class="cell">3</div><div class="cell">4</div><div class="cell">5</div>
      </div>
      <div class="cap"><code>heap[ 2 ]</code> 取出描述符</div>
    </div>
    <div class="arrow rv" data-at="3">→</div>
    <div class="box rv" data-at="3">
      <div class="lbl">③ 画面</div>
      <img class="shot" src="../shot_2.png">
      <div class="cap">scene 2 被渲染</div>
    </div>
  </div>
  <div class="rv" data-at="4" style="text-align:center;font-size:26px;color:#d2d2e4;margin-top:8px">
    没有重建描述符、没有重绑 set —— 6 个场景一直躺在堆里,运行时只是<b style="color:var(--accent)">换了个索引</b>。
    索引来源可选 <code>HEAP_WITH_PUSH_INDEX</code> / 间接 buffer / shader record。</div>
</div>
<div class="badge">VK_EXT_descriptor_heap</div>
<script>
  const step=+(new URLSearchParams(location.search).get('step')||0);
  document.querySelectorAll('.rv').forEach(e=>{ if(+e.dataset.at>step) e.style.opacity=0; });
</script>
</body></html>
